name: Build Jellyfin Enhanced (Jellyfin 12)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Jellyfin.Plugin.JellyfinEnhanced/**'
      - '.github/workflows/build-jf12.yml'

permissions:
  contents: read

concurrency:
  group: build-jf12-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Restore locked dependencies
        run: dotnet restore Jellyfin.Plugin.JellyfinEnhanced/JellyfinEnhanced.csproj -p:JellyfinTarget=jf12 --locked-mode

      - name: Build Release for Jellyfin 12
        run: dotnet build Jellyfin.Plugin.JellyfinEnhanced/JellyfinEnhanced.csproj --configuration Release --no-restore -p:JellyfinTarget=jf12

      - name: Verify plugin assembly
        shell: bash
        run: |
          set -euo pipefail
          DLL="Jellyfin.Plugin.JellyfinEnhanced/bin/Release/net10.0/Jellyfin.Plugin.JellyfinEnhanced.dll"
          test -s "$DLL"
          mkdir -p artifacts
          cp "$DLL" artifacts/

      - name: Upload plugin DLL
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: JellyfinEnhanced-jf12
          path: artifacts/Jellyfin.Plugin.JellyfinEnhanced.dll
          if-no-files-found: error
          retention-days: 14
